[project]
authors = [{ name = "bash000000", email = "m2588953@outlook.com" }]
name = "lawrag"
requires-python = ">= 3.14, < 3.15"
version = "0.1.0"
dependencies = [
  "numpy>=2.3",
  "pandas>=3.0",
  "scipy>=1.17.1",
  "fastapi[standard]>=0.119.1",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.12.3",
  "pydantic-settings>=2.11.0",
  "pydantic-ai>=2.5.0",
  "pydantic-ai-harness>=0.5.0",
  "requests>=2.32.0",
  "anyio>=4.11.0",
  "asyncer>=0.0.10",
  "rich>=15.0.0",
  "typer>=0.21.1",
  "sqlalchemy[asyncio]>=2.0.51",
  "sqlmodel>=0.0.32",
  "sqlalchemy-utils>=0.42.0",
  "psycopg[c,pool]>=3.3",
  "pgvector>=0.4.1",
  "openai>=2.6.1",
  "tomlkit>=0.13.3",
  "pydantic-monty>=0.0.4",
  "lxml>=5.3.0",
  "beautifulsoup4>=4.12.0",
  "markitdown[all]>=0.1.5",
  "spacy>=3.8.13",
  "zh-core-web-trf",
  "mmh3>=5.2.1",
  "pyjwt>=2.12.1",
  "torch>=2.12.0",
  "exa-py>=2.16.0",
  "scrapy>=2.16.0",
  "selenium>=4.45.0",
  "cn2an>=0.5.24",
  "tabulate>=0.10.0",
]

[project.scripts]
lawrag = "lawrag.__main__:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "ruff>=0.15.11",
  "ty>=0.0.32",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-mock>=3.15.1",
  "pytest-dependency>=0.6.1",
  "ipython>=9.8.0",
]

[tool.uv]
exclude-dependencies = ["httpx", "httpcore"]

[tool.uv.build-backend]
module-name = "lawrag"
module-root = ""

[[tool.uv.index]]
name = "pypi"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true


[[tool.uv.index]]
name = "pytorch"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu132"
explicit = true

[tool.uv.sources]
zh-core-web-trf = { url = "https://gh.halonice.com/https://github.com/explosion/spacy-models/releases/download/zh_core_web_trf-3.8.0/zh_core_web_trf-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"
fix = true

[tool.ruff.analyze]
preview = true

[tool.ruff.lint]
preview = true
select = [
  "F",
  "E",
  "W",
  "I",
  "N",
  "FAST",
  "PLC",
  "PLW",
  "PLE",
  "COM",
  "UP",
  "NPY",
  "PD",
  "ASYNC",
  "B",
  "C4",
  "FURB",
  "PT",
  "PTH",
]
ignore = ["bad-dunder-method-name", "too-many-statements-in-try-clause"]
fixable = ["ALL"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty.environment]
root = ["./"]
python-platform = "linux"
python-version = "3.14"
python = ".venv/bin/python"

[tool.ty.src]
include = ["lawrag", "tests"]

[tool.ty.rules]
division-by-zero = "error"
possibly-unresolved-reference = "warn"
possibly-missing-import = "warn"
unsupported-dynamic-base = "warn"

[tool.pytest.ini_options]
addopts = "-p lawrag"
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
markers = ["db: tests that require a running PostgreSQL database"]
